name: GPU Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-unittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: gpu-unit

  unittest:
    needs: bypass
    # A failed gate must run the diagnostic, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    name: SSB CPU ABBA (M02, no GPU)
    runs-on: [self-hosted, linux, x64, ci-duration-02]
    timeout-minutes: 20
    env:
      CI_HARNESS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_HARNESS_DIR: ssb-harness-${{ github.run_id }}-${{ github.run_attempt }}-02
      CI_CONTAINER: relax-ssb-${{ github.run_id }}-${{ github.run_attempt }}-02
      CI_ARTIFACT_DIR: duration-ssb-${{ github.run_id }}-${{ github.run_attempt }}-02
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: sha256:bb7be4d7b1543361e7b6354d16aab9550b1b7985ed0db9d390ee55493c75f93b
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_HARNESS_REF }}

      - name: Stage CPU diagnostic
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$CI_HARNESS_DIR"
          cp .github/ci/duration_cpu_control.py .github/ci/duration_ssb_control.py "$RUNNER_TEMP/$CI_HARNESS_DIR/"
          echo "Diagnostic harness: $CI_HARNESS_REF"

      - name: Run CPU SSB comparison
        id: comparison
        timeout-minutes: 5
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")
          [[ "$actual" == "$CI_IMAGE" ]] || { echo "Immutable image mismatch" >&2; exit 1; }
          [[ "$CI_HARNESS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid harness SHA" >&2; exit 1; }
          artifacts="$RUNNER_TEMP/$CI_ARTIFACT_DIR"
          if docker inspect "$CI_CONTAINER" >/dev/null 2>&1 || [[ -e "$artifacts" ]]; then
            echo "Refusing to overwrite an existing CPU diagnostic" >&2
            exit 1
          fi
          mkdir -p "$artifacts"
          printf '{"mode":"same_container_CPU_SSB_ABBA","host":"M02","image":"%s","harness_ref":"%s","order":["01-A","02-B","03-B","04-A"],"A":"original_thread_state_unchanged","B":"calling_thread_PR_SPEC_DISABLE_only","gpu_work":false,"system_configuration_changed":false}\n' \
            "$CI_IMAGE" "$CI_HARNESS_REF" > "$artifacts/comparison-plan.json"
          docker image inspect --format '{{json .RootFS.Layers}}' "$CI_IMAGE" > "$artifacts/image-rootfs.json"
          docker version --format '{{json .Server.Components}}' > "$artifacts/runtime-versions.json"
          docker create --pull never --rm --init --runtime=runc --network=none \
            --name "$CI_CONTAINER" --env NVIDIA_VISIBLE_DEVICES=void \
            --env CI_HARNESS_REF --env CI_RUN_ID --env CI_RUN_ATTEMPT --env CI_IMAGE \
            -v "$RUNNER_TEMP/$CI_HARNESS_DIR:/duration-harness:ro" \
            -v "$artifacts:/artifacts" \
            --entrypoint /bin/bash "$CI_IMAGE" -c 'sleep infinity'
          cleanup() {
            status=$?
            trap - EXIT
            if ! docker rm --force "$CI_CONTAINER" >/dev/null 2>&1; then
              if (( status == 0 )); then status=1; fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          echo "container_created=true" >> "$GITHUB_OUTPUT"
          docker inspect --format 'Image={{.Image}} Runtime={{.HostConfig.Runtime}} CpuQuota={{.HostConfig.CpuQuota}} CpuPeriod={{.HostConfig.CpuPeriod}} CpusetCpus={{.HostConfig.CpusetCpus}} Memory={{.HostConfig.Memory}} Network={{.HostConfig.NetworkMode}} Devices={{json .HostConfig.DeviceRequests}}' \
            "$CI_CONTAINER" > "$artifacts/container-conditions.txt"
          docker start "$CI_CONTAINER"
          for trial in 01-A 02-B 03-B 04-A; do
            echo "Starting CPU trial $trial"
            docker exec --env CI_TRIAL="$trial" "$CI_CONTAINER" timeout --signal=TERM --kill-after=5s 60s \
              python -I -S /duration-harness/duration_ssb_control.py "/artifacts/$trial.json" "${trial##*-}"
            echo "Completed CPU trial $trial"
          done

      - name: Remove CPU comparison container
        if: ${{ always() && steps.comparison.outputs.container_created == 'true' }}
        run: |
          if docker inspect "$CI_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$CI_CONTAINER"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duration-ssb-${{ github.run_id }}-${{ github.run_attempt }}-02
          path: ${{ runner.temp }}/${{ env.CI_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
