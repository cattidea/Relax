name: GPU Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-unittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: gpu-unit

  unittest:
    needs: bypass
    # A failed gate must run the tests, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    name: CU12 source ABBA (M01, 4 GPUs)
    runs-on: [self-hosted, linux, x64, ci-duration-01]
    timeout-minutes: 100
    env:
      CI_SOURCE_OLD: 13816f8692f087104b7222087af565b6dee5fbab
      CI_SOURCE_NEW: ea3f0cee94b9400cfe1591beb4f2dbfe712d362c
      CI_SOURCE_OLD_DIR: ${{ github.workspace }}/duration-source-A
      CI_SOURCE_NEW_DIR: ${{ github.workspace }}/duration-source-B
      CI_HARNESS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_HARNESS_DIR: duration-harness-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_CONTAINER_PREFIX: relax-source-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_ARTIFACT_DIR: duration-source-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: sha256:bb7be4d7b1543361e7b6354d16aab9550b1b7985ed0db9d390ee55493c75f93b
      HOST_UV_CACHE_DIR: /home/relax-ci/.cache/uv
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_HARNESS_REF }}

      - name: Stage diagnostic harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$CI_HARNESS_DIR"
          cp .github/ci/duration_trace.py .github/ci/instrument_duration.py .github/ci/duration_cpu_control.py .github/ci/run_duration_source_control.sh "$RUNNER_TEMP/$CI_HARNESS_DIR/"
          echo "Diagnostic harness: $CI_HARNESS_REF"

      - name: Checkout old source A
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_SOURCE_OLD }}
          path: duration-source-A

      - name: Checkout new source B
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_SOURCE_NEW }}
          path: duration-source-B

      - name: Verify immutable test image
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")
          [[ "$actual" == "$CI_IMAGE" ]]
          echo "Source order: A=$CI_SOURCE_OLD B=$CI_SOURCE_NEW B A"
          echo "Frozen image: $actual"

      - name: Acquire test devices
        id: devices
        uses: ./.github/actions/acquire-devices
        timeout-minutes: 35
        with:
          backend: nvidia
          # Reserve all devices so other GPU jobs cannot overlap this measurement.
          # The test container still sees the same four physical indices as the baseline.
          count: 8
          devices: 0,1,2,3,4,5,6,7
          timeout: 1800

      - name: Run source comparison
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export CI_HARNESS_PATH="$RUNNER_TEMP/$CI_HARNESS_DIR"
          export CI_ARTIFACT_ROOT="$RUNNER_TEMP/$CI_ARTIFACT_DIR"
          bash "$CI_HARNESS_PATH/run_duration_source_control.sh"

      - name: Remove comparison containers
        if: always()
        run: |
          for suffix in 01-A 02-B 03-B 04-A; do
            name="$CI_CONTAINER_PREFIX-$suffix"
            if docker inspect "$name" >/dev/null 2>&1; then
              docker rm --force "$name"
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duration-source-${{ github.run_id }}-${{ github.run_attempt }}-01
          path: ${{ runner.temp }}/${{ env.CI_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
