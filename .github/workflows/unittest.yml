name: GPU Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-unittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: gpu-unit

  unittest:
    needs: bypass
    # A failed gate must run the tests, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    strategy:
      fail-fast: false
      matrix:
        host: ['01', '02']
    name: CU12 duration control (${{ matrix.host }}, 4 GPUs)
    runs-on: [self-hosted, linux, x64, 'ci-duration-${{ matrix.host }}']
    timeout-minutes: 100
    env:
      CI_SOURCE_REF: ea3f0cee94b9400cfe1591beb4f2dbfe712d362c
      CI_CONTAINER_NAME: relax-duration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
      CI_IMAGE: sha256:bb7be4d7b1543361e7b6354d16aab9550b1b7985ed0db9d390ee55493c75f93b
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Keep the tested source identical to the historical 24/29-minute comparison.
          ref: ${{ env.CI_SOURCE_REF }}

      - name: Verify immutable test image
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")
          [[ "$actual" == "$CI_IMAGE" ]]
          echo "Frozen source: $CI_SOURCE_REF"
          echo "Frozen image: $actual"

      - name: Acquire test devices
        id: devices
        uses: ./.github/actions/acquire-devices
        timeout-minutes: 35
        with:
          backend: nvidia
          # Reserve all devices so other GPU jobs cannot overlap this measurement.
          # The test container still sees the same four physical indices as the baseline.
          count: 8
          devices: 0,1,2,3,4,5,6,7
          timeout: 1800

      - name: Create test container
        env:
          CI_DEVICES: 4,5,6,7
          HOST_UV_CACHE_DIR: /home/relax-ci/.cache/uv
          UV_CACHE_DIR: /uv-cache
          UV_LINK_MODE: copy
          ARTIFACT_DIR: ${{ runner.temp }}/duration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
        run: |
          set -euo pipefail
          mkdir -p "$HOST_UV_CACHE_DIR" "$ARTIFACT_DIR"

          # Keep network, IPC and /tmp private for parallel Ray/NCCL tests.
          # Create before starting so cancellation during a pull cannot start tests.
          docker create --pull never --rm --init \
            --name "$CI_CONTAINER_NAME" \
            --gpus "\"device=$CI_DEVICES\"" \
            --shm-size=32g \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$ARTIFACT_DIR:/artifacts" \
            -v "$HOST_UV_CACHE_DIR:$UV_CACHE_DIR" \
            --workdir /workspace/Relax \
            --env UV_CACHE_DIR \
            --env UV_LINK_MODE \
            --env http_proxy \
            --env https_proxy \
            --env no_proxy \
            --entrypoint /bin/bash "$CI_IMAGE" -c 'sleep infinity'
          docker inspect --format 'Test image: {{.Config.Image}} ({{.Image}})' "$CI_CONTAINER_NAME"
          docker start "$CI_CONTAINER_NAME"

      - name: Prepare workspace and show GPUs
        run: |
          docker exec "$CI_CONTAINER_NAME" bash -euc '
            cp -a --no-preserve=ownership /source/. /workspace/Relax/
            nvidia-smi
          '

      - name: Install dependencies
        run: |
          docker exec "$CI_CONTAINER_NAME" uv pip install \
            --system --break-system-packages -r requirements.txt \
            --extra-index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple \
            cryptography==50.0.2 oauthlib==4.0.0 pyparsing==3.3.3

      - name: Record measurement conditions
        run: |
          docker inspect --format 'Image={{.Image}} CpuQuota={{.HostConfig.CpuQuota}} CpuPeriod={{.HostConfig.CpuPeriod}} CpusetCpus={{.HostConfig.CpusetCpus}} Memory={{.HostConfig.Memory}}' "$CI_CONTAINER_NAME"
          docker exec "$CI_CONTAINER_NAME" python -c 'import importlib.metadata as m, json, os; from pathlib import Path; packages = sorted((d.metadata["Name"], d.version) for d in m.distributions()); info = {"packages": packages, "affinity": sorted(os.sched_getaffinity(0)), "threads": {k: os.environ.get(k) for k in ("OMP_NUM_THREADS", "MKL_NUM_THREADS", "OPENBLAS_NUM_THREADS")}}; Path("/artifacts/environment.json").write_text(json.dumps(info, indent=2)); print(json.dumps({k: v for k, v in info.items() if k != "packages"}))'
          docker exec "$CI_CONTAINER_NAME" sha256sum /artifacts/environment.json

      - name: Run unittest
        timeout-minutes: 40
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/duration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
        run: |
          # Observe contention without importing test dependencies or changing clocks.
          (
            while true; do
              date -u +%FT%TZ
              awk '/^cpu |^procs_running/ {print}' /proc/stat
              awk '/^processor|^cpu MHz/ {print}' /proc/cpuinfo
              cat /proc/loadavg /proc/diskstats
              nvidia-smi --query-gpu=index,utilization.gpu,clocks.sm,power.draw --format=csv,noheader,nounits
              ps -eo comm | sort | uniq -c | awk '$2 ~ /^(nvcc|cc1plus|buildkitd)$/ {print}'
              sleep 5
            done
          ) > "$ARTIFACT_DIR/host-samples.log" 2>&1 &
          sampler_pid=$!
          trap 'kill "$sampler_pid" 2>/dev/null || true; wait "$sampler_pid" 2>/dev/null || true' EXIT
          docker exec "$CI_CONTAINER_NAME" bash -euo pipefail -c '
            python -m pytest tests/ -v -ra --tb=short --durations=20 --junitxml=/artifacts/junit.xml \
              2>&1 | tee /artifacts/pytest.log
          '

      - name: Remove test container
        if: always()
        run: |
          if docker inspect "$CI_CONTAINER_NAME" >/dev/null 2>&1; then
            docker rm --force "$CI_CONTAINER_NAME"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}
          path: ${{ runner.temp }}/duration-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.host }}/
          if-no-files-found: warn
          retention-days: 14
