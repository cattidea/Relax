name: GPU Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-unittest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bypass:
    name: Check CI bypass
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/check-bypass.yml
    with:
      target: gpu-unit

  unittest:
    needs: bypass
    # A failed gate must run the diagnostic, never grant an exemption.
    if: ${{ !cancelled() && (needs.bypass.result != 'success' || needs.bypass.outputs.can-skip != 'true') }}
    name: M01 container policy ABBA and gated full suite
    runs-on: [self-hosted, linux, x64, ci-duration-01]
    timeout-minutes: 100
    env:
      CI_HARNESS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      CI_SOURCE_REF: ea3f0cee94b9400cfe1591beb4f2dbfe712d362c
      CI_SOURCE_DIR: ${{ github.workspace }}/duration-source
      CI_HARNESS_DIR: policy-harness-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_CONTAINER_PREFIX: relax-policy-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_ARTIFACT_DIR: duration-policy-${{ github.run_id }}-${{ github.run_attempt }}-01
      CI_RUN_ID: ${{ github.run_id }}
      CI_RUN_ATTEMPT: ${{ github.run_attempt }}
      CI_IMAGE: sha256:bb7be4d7b1543361e7b6354d16aab9550b1b7985ed0db9d390ee55493c75f93b
      HOST_UV_CACHE_DIR: /home/relax-ci/.cache/uv
    steps:
      - name: Checkout diagnostic harness
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_HARNESS_REF }}

      - name: Stage diagnostic harness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/$CI_HARNESS_DIR"
          cp .github/ci/duration_trace.py .github/ci/instrument_duration.py .github/ci/duration_cpu_control.py .github/ci/duration_ssb_control.py .github/ci/duration_container_gate.py .github/ci/run_duration_source_control.sh "$RUNNER_TEMP/$CI_HARNESS_DIR/"
          echo "Diagnostic harness: $CI_HARNESS_REF"

      - name: Checkout fixed test source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.CI_SOURCE_REF }}
          path: duration-source

      - name: Verify immutable test image
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Id}}' "$CI_IMAGE")
          [[ "$actual" == "$CI_IMAGE" ]] || { echo "Immutable image mismatch" >&2; exit 1; }
          echo "Fixed source: $CI_SOURCE_REF; frozen image: $actual"

      - name: Acquire test devices
        id: devices
        uses: ./.github/actions/acquire-devices
        timeout-minutes: 35
        with:
          backend: nvidia
          count: 8
          devices: 0,1,2,3,4,5,6,7
          timeout: 1800

      - name: Compare subset and conditionally run full suite
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export CI_HARNESS_PATH="$RUNNER_TEMP/$CI_HARNESS_DIR"
          export CI_ARTIFACT_ROOT="$RUNNER_TEMP/$CI_ARTIFACT_DIR"
          bash "$CI_HARNESS_PATH/run_duration_source_control.sh"

      - name: Remove owned comparison containers
        if: always()
        run: |
          set -euo pipefail
          owned="$RUNNER_TEMP/$CI_ARTIFACT_DIR/owned-containers.txt"
          if [[ -f "$owned" ]]; then
            while IFS= read -r name; do
              case "$name" in
                "$CI_CONTAINER_PREFIX"-01-A|"$CI_CONTAINER_PREFIX"-02-B|"$CI_CONTAINER_PREFIX"-03-B|"$CI_CONTAINER_PREFIX"-04-A|"$CI_CONTAINER_PREFIX"-05-full-B)
                  if docker inspect "$name" >/dev/null 2>&1; then docker rm --force "$name"; fi
                  ;;
                *) echo "Invalid owned-container marker" >&2; exit 1 ;;
              esac
            done < "$owned"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: duration-policy-${{ github.run_id }}-${{ github.run_attempt }}-01
          path: ${{ runner.temp }}/${{ env.CI_ARTIFACT_DIR }}/
          if-no-files-found: warn
          retention-days: 14
